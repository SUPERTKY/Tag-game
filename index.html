<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Tag Game - パスワード保護</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      overflow: hidden;
      background: #1b1b1b;
    }

    #wait-screen {
      position: relative;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background-image: url("image/Wait.png");
      background-position: center;
      background-size: cover;
      background-repeat: no-repeat;
    }

    #matching-button {
      position: absolute;
      left: 50%;
      top: 62%;
      transform: translate(-50%, -50%);
      width: min(34vw, 300px);
      height: auto;
      user-select: none;
      pointer-events: none;
    }

    #admin-button {
      position: absolute;
      left: 16px;
      bottom: 16px;
      width: 48px;
      height: 48px;
      padding: 0;
      border: 0;
      background: transparent;
      cursor: pointer;
    }

    #admin-button img {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: contain;
      user-select: none;
    }

    #admin-screen {
      display: none;
      position: relative;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background-image: url("image/admin_background.png");
      background-position: center;
      background-size: cover;
      background-repeat: no-repeat;
    }

    #admin-screen.active {
      display: block;
    }

    #create-room-button {
      position: absolute;
      left: 50%;
      top: 58%;
      transform: translate(-50%, -50%);
      width: min(42vw, 360px);
      height: auto;
      user-select: none;
      pointer-events: none;
    }

    canvas {
      display: none;
      width: min(100vw, 960px);
      height: auto;
      image-rendering: pixelated;
      border: 2px solid #eee;
      background: #69b64a;
    }
  </style>
</head>
<body>
  <div id="wait-screen" aria-label="待機画面">
    <img id="matching-button" src="image/Matching_Button.png" alt="マッチング開始" />
    <button id="admin-button" type="button" aria-label="管理者画面を開く">
      <img src="image/admin_logo.png" alt="" />
    </button>
  </div>
  <section id="admin-screen" aria-label="管理者画面">
    <img id="create-room-button" src="image/create_room_button.png" alt="部屋を作成" />
  </section>
  <canvas id="game" width="960" height="540"></canvas>

  <script>
    const waitScreen = document.querySelector("#wait-screen");
    const adminButton = document.querySelector("#admin-button");
    const adminScreen = document.querySelector("#admin-screen");
    const canvas = document.querySelector("#game");
    const ctx = canvas.getContext("2d");

    adminButton.addEventListener("click", async () => {
      const password = window.prompt("管理者パスワードを入力してください");

      if (!password) return;

      const response = await fetch("/api/admin-login", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ password }),
      });

      if (!response.ok) return;

      waitScreen.style.display = "none";
      adminScreen.classList.add("active");
    });

    // ファイル名は手元の画像に合わせて変更してください
    const sprites = {
      idle: new Image(),
      run1: new Image(),
      run2: new Image(),
      ground: new Image(),
      house: new Image(),
    };

    sprites.idle.src = "character/boy/standing_boy.png";
    sprites.run1.src = "character/boy/running_boy_1.png";
    sprites.run2.src = "character/boy/running_boy_2.png";
    sprites.ground.src = "Ground.png";
    sprites.house.src = "Obstacle/house.png";

    // ワールドの広さ。canvasより大きくして、カメラ追従を作る
    const world = {
      width: 5000,
      height: 3500,
    };

    const tileSize = 64;

    const obstacles = [
      {
        x: world.width / 2 + tileSize * 3,
        y: world.height / 2 - tileSize * 2,
        width: tileSize * 4,
        height: tileSize * 4,
        image: sprites.house,
      },
    ];

    const player = {
      x: world.width / 2,
      y: world.height / 2,
      width: 48,
      height: 48,
      speed: 280, // 1秒あたりの移動量
      facing: 1,  // 1: 右向き / -1: 左向き
      idleFacing: 1, // 最後に走った見た目の向き
    };

    const movementKeys = new Set([
      "arrowleft",
      "arrowright",
      "arrowup",
      "arrowdown",
      "a",
      "d",
      "w",
      "s",
    ]);
    const keys = {};

    function resetMovementInput() {
      for (const key of movementKeys) {
        keys[key] = false;
      }
    }

    function handleMovementKey(event, isPressed) {
      const key = event.key.toLowerCase();

      if (!movementKeys.has(key)) return;

      keys[key] = isPressed;
      event.preventDefault();
    }

    window.addEventListener("keydown", (event) => {
      handleMovementKey(event, true);
    });

    window.addEventListener("keyup", (event) => {
      handleMovementKey(event, false);
    });

    window.addEventListener("blur", resetMovementInput);
    window.addEventListener("pagehide", resetMovementInput);
    document.addEventListener("visibilitychange", () => {
      if (document.hidden) resetMovementInput();
    });

    let running = false;
    let animationTime = 0;
    let previousTime = performance.now();

    function update(delta) {
      let dx = 0;
      let dy = 0;

      if (keys["arrowleft"] || keys["a"]) dx -= 1;
      if (keys["arrowright"] || keys["d"]) dx += 1;
      if (keys["arrowup"] || keys["w"]) dy -= 1;
      if (keys["arrowdown"] || keys["s"]) dy += 1;

      running = dx !== 0 || dy !== 0;

      // 斜め移動が速くなりすぎないよう調整
      if (running) {
        const length = Math.hypot(dx, dy);
        dx /= length;
        dy /= length;

        movePlayer(dx * player.speed * delta, dy * player.speed * delta);

        if (dx !== 0) {
          player.facing = dx > 0 ? 1 : -1;
        }

        // 走り画像は元画像の向きが待機画像と逆なので、
        // 実際に画面へ描く向きを保存して、停止時の待機向きに使う
        player.idleFacing = player.facing * -1;

        animationTime += delta;
      } else {
        animationTime = 0;
      }

      // フィールド外に出ないようにする
      clampPlayerToWorld();
    }

    function rectanglesOverlap(a, b) {
      return (
        a.x < b.x + b.width &&
        a.x + a.width > b.x &&
        a.y < b.y + b.height &&
        a.y + a.height > b.y
      );
    }

    function collidesWithObstacle(x, y) {
      const nextPlayerArea = {
        x,
        y,
        width: player.width,
        height: player.height,
      };

      return obstacles.some((obstacle) => rectanglesOverlap(nextPlayerArea, obstacle));
    }

    function clampPlayerToWorld() {
      player.x = Math.max(0, Math.min(world.width - player.width, player.x));
      player.y = Math.max(0, Math.min(world.height - player.height, player.y));
    }

    function movePlayer(deltaX, deltaY) {
      const nextX = Math.max(0, Math.min(world.width - player.width, player.x + deltaX));
      if (!collidesWithObstacle(nextX, player.y)) {
        player.x = nextX;
      }

      const nextY = Math.max(0, Math.min(world.height - player.height, player.y + deltaY));
      if (!collidesWithObstacle(player.x, nextY)) {
        player.y = nextY;
      }
    }

    function getCamera() {
      let x = player.x + player.width / 2 - canvas.width / 2;
      let y = player.y + player.height / 2 - canvas.height / 2;

      x = Math.max(0, Math.min(world.width - canvas.width, x));
      y = Math.max(0, Math.min(world.height - canvas.height, y));

      return { x, y };
    }

    function drawWorld(camera) {
      drawGround(camera);
      drawObstacles(camera);

      // ワールド端を確認しやすい枠
      ctx.strokeStyle = "#355f28";
      ctx.lineWidth = 6;
      ctx.strokeRect(-camera.x, -camera.y, world.width, world.height);
    }

    function drawGround(camera) {
      if (!sprites.ground.complete || sprites.ground.naturalWidth === 0) {
        ctx.fillStyle = "#69b64a";
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        return;
      }

      const pattern = ctx.createPattern(sprites.ground, "repeat");

      ctx.save();
      ctx.translate(-(camera.x % sprites.ground.width), -(camera.y % sprites.ground.height));
      ctx.fillStyle = pattern;
      ctx.fillRect(
        0,
        0,
        canvas.width + sprites.ground.width,
        canvas.height + sprites.ground.height,
      );
      ctx.restore();
    }

    function drawObstacles(camera) {
      for (const obstacle of obstacles) {
        if (!obstacle.image.complete || obstacle.image.naturalWidth === 0) continue;

        ctx.drawImage(
          obstacle.image,
          obstacle.x - camera.x,
          obstacle.y - camera.y,
          obstacle.width,
          obstacle.height,
        );
      }
    }

    function drawPlayer(camera) {
      let image = sprites.idle;

      if (running) {
        // 0.15秒ごとに2フレームを切り替える
        const frame = Math.floor(animationTime / 0.15) % 2;
        image = frame === 0 ? sprites.run1 : sprites.run2;
      }

      const screenX = player.x - camera.x;
      const screenY = player.y - camera.y;

      ctx.save();

      // 走り画像は元画像の向きが待機画像と逆なので、走っている間だけ反転条件を逆にする
      const drawFacing = running ? player.facing * -1 : player.idleFacing;

      if (drawFacing === -1) {
        ctx.translate(screenX + player.width, screenY);
        ctx.scale(-1, 1);
        ctx.drawImage(image, 0, 0, player.width, player.height);
      } else {
        ctx.drawImage(image, screenX, screenY, player.width, player.height);
      }

      ctx.restore();
    }

    function drawUI() {
      ctx.fillStyle = "rgba(0, 0, 0, 0.55)";
      ctx.fillRect(12, 12, 360, 98);

      ctx.fillStyle = "white";
      ctx.font = "16px sans-serif";
      ctx.fillText("矢印キー / WASD で移動", 24, 35);
      ctx.fillText(`座標: ${Math.round(player.x)}, ${Math.round(player.y)}`, 24, 57);
      ctx.fillText("家は4コマ分の障害物", 24, 79);
      ctx.fillText("Cloudflare Pagesで36人向けに保護公開", 24, 101);
    }

    function loop(now) {
      const delta = Math.min((now - previousTime) / 1000, 0.05);
      previousTime = now;

      update(delta);

      const camera = getCamera();
      drawWorld(camera);
      drawPlayer(camera);
      drawUI();

      requestAnimationFrame(loop);
    }

    requestAnimationFrame(loop);
  </script>
</body>
</html>
