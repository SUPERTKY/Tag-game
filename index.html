<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Tag Game - パスワード保護</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      overflow: hidden;
      background: #1b1b1b;
    }

    #wait-screen {
      position: relative;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background-image: url("image/Wait.png");
      background-position: center;
      background-size: cover;
      background-repeat: no-repeat;
    }

    #matching-status {
      position: absolute;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      min-width: min(80vw, 520px);
      padding: 14px 18px;
      border-radius: 14px;
      color: #fff;
      font: bold 20px/1.5 sans-serif;
      text-align: center;
      text-shadow: 0 2px 4px rgba(0, 0, 0, 0.75);
      background: rgba(0, 0, 0, 0.55);
      opacity: 0;
      transition: opacity 0.2s ease;
      pointer-events: none;
    }

    #matching-status.visible {
      opacity: 1;
    }

    #matching-button {
      position: absolute;
      left: 50%;
      top: 62%;
      transform: translate(-50%, -50%);
      width: min(34vw, 300px);
      height: auto;
      user-select: none;
      cursor: pointer;
    }

    .wait-icon-button {
      position: absolute;
      left: 16px;
      width: 48px;
      height: 48px;
      padding: 0;
      border: 0;
      background: transparent;
      cursor: pointer;
    }

    #teacher-button {
      bottom: 80px;
    }

    #admin-button {
      bottom: 16px;
    }

    .wait-icon-button img {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: contain;
      user-select: none;
    }

    #admin-screen {
      display: none;
      position: relative;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background-image: url("image/admin_background.png");
      background-position: center;
      background-size: cover;
      background-repeat: no-repeat;
    }

    #admin-screen.active {
      display: block;
    }

    #admin-player-count {
      position: absolute;
      left: 50%;
      top: 26%;
      transform: translate(-50%, -50%);
      min-width: min(72vw, 440px);
      padding: 14px 18px;
      border-radius: 14px;
      color: #fff;
      font: bold 22px/1.4 sans-serif;
      text-align: center;
      text-shadow: 0 2px 4px rgba(0, 0, 0, 0.75);
      background: rgba(0, 0, 0, 0.55);
    }

    .admin-image-button {
      position: absolute;
      height: auto;
      user-select: none;
      cursor: pointer;
      transition: filter 0.2s ease, opacity 0.2s ease;
    }

    .admin-image-button[aria-disabled="true"] {
      cursor: not-allowed;
      filter: grayscale(0.7);
      opacity: 0.55;
    }

    #create-room-button {
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      width: min(42vw, 360px);
    }

    #release-room-button {
      display: none;
      left: 50%;
      top: 66%;
      transform: translate(-50%, -50%);
      width: min(34vw, 300px);
    }

    #release-room-button.visible {
      display: block;
    }

    #start-game-button {
      display: none;
      left: 50%;
      top: 82%;
      transform: translate(-50%, -50%);
      width: min(34vw, 300px);
    }

    #start-game-button.visible {
      display: block;
    }

    canvas {
      display: none;
      width: min(100vw, 960px);
      height: auto;
      image-rendering: pixelated;
      border: 2px solid #eee;
      background: #69b64a;
    }
  </style>
</head>
<body>
  <div id="wait-screen" aria-label="待機画面">
    <div id="matching-status" role="status" aria-live="polite"></div>
    <img id="matching-button" src="image/Matching_Button.png" alt="マッチング開始" />
    <button id="teacher-button" class="wait-icon-button" type="button" aria-label="先生ログインを開く">
      <img src="image/teacher_logo.png" alt="" />
    </button>
    <button id="admin-button" class="wait-icon-button" type="button" aria-label="管理者画面を開く">
      <img src="image/admin_logo.png" alt="" />
    </button>
  </div>
  <section id="admin-screen" aria-label="管理者画面">
    <div id="admin-player-count" aria-live="polite">参加人数: 0人</div>
    <img id="create-room-button" class="admin-image-button" src="image/create_room_button.png" alt="部屋を作成" role="button" tabindex="0" />
    <img id="release-room-button" class="admin-image-button" src="image/Release_button.png" alt="部屋を切断" role="button" tabindex="0" />
    <img id="start-game-button" class="admin-image-button" src="image/taggame_start_button.png" alt="ゲームスタート" role="button" tabindex="0" />
  </section>
  <canvas id="game" width="960" height="540"></canvas>

  <script>
    const waitScreen = document.querySelector("#wait-screen");
    const teacherButton = document.querySelector("#teacher-button");
    const adminButton = document.querySelector("#admin-button");
    const adminScreen = document.querySelector("#admin-screen");
    const matchingButton = document.querySelector("#matching-button");
    const matchingStatus = document.querySelector("#matching-status");
    const adminPlayerCount = document.querySelector("#admin-player-count");
    const createRoomButton = document.querySelector("#create-room-button");
    const releaseRoomButton = document.querySelector("#release-room-button");
    const startGameButton = document.querySelector("#start-game-button");
    const canvas = document.querySelector("#game");
    const ctx = canvas.getContext("2d");
    const playerId = getOrCreatePlayerId();
    let latestPlayers = [];
    let gameJoined = false;
    let adminMode = false;
    let teacherMode = false;
    let lastPlayerSyncAt = 0;
    let playerSyncInFlight = false;
    let latestRoomStatus = "none";
    let countdownEndsAt = null;
    const previousItPlayerIds = new Set();
    const activeExplosionEffects = new Map();
    const explosionDurationMs = 1500;
    const explosionFrameDurationMs = 150;
    const explosionSound = new Audio("Sound/explosion.mp3");
    explosionSound.preload = "auto";

    teacherButton.addEventListener("click", async () => {
      const password = window.prompt("先生パスワードを入力してください");

      if (!password) return;

      const response = await fetch("/api/teacher-login", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ password }),
      });

      if (!response.ok) return;

      teacherMode = true;
      setMatchingMessage("先生として認証しました。参加すると鬼になります。");
    });

    adminButton.addEventListener("click", async () => {
      const password = window.prompt("管理者パスワードを入力してください");

      if (!password) return;

      const response = await fetch("/api/admin-login", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ password }),
      });

      if (!response.ok) return;

      adminMode = true;
      waitScreen.style.display = "none";
      adminScreen.classList.add("active");
      await refreshRoomStatus();
    });

    matchingButton.addEventListener("click", async () => {
      const roomStatus = await refreshRoomStatus();

      if (!roomStatus.exists) {
        setMatchingMessage("部屋がありません。管理者が部屋を作成するまで待ってください。");
        return;
      }

      if (roomStatus.status === "playing" || roomStatus.status === "countdown") {
        await showGameScreen();
        return;
      }

      setMatchingMessage("部屋があります。ゲーム開始まで待機してください。");
    });

    createRoomButton.addEventListener("click", async () => {
      if (createRoomButton.getAttribute("aria-disabled") === "true") return;

      await updateRoom("POST", { action: "create" });
      await refreshRoomStatus();
    });

    releaseRoomButton.addEventListener("click", async () => {
      await updateRoom("DELETE");
      await refreshRoomStatus();
      showWaitScreen();
    });

    startGameButton.addEventListener("click", async () => {
      const roomStatus = await updateRoom("POST", { action: "start" });
      updateRoomControls(roomStatus);
      if (roomStatus.exists && roomStatus.status === "countdown") {
        setMatchingMessage("鬼を配置しました。5秒後にゲームを開始します。");
      }
    });

    async function updateRoom(method, body) {
      const response = await fetch("/api/room", {
        method,
        headers: body ? { "Content-Type": "application/json" } : undefined,
        body: body ? JSON.stringify(body) : undefined,
      });

      return response.json();
    }

    async function refreshRoomStatus() {
      const response = await fetch("/api/room");
      const roomStatus = await response.json();
      latestRoomStatus = roomStatus.status || "none";
      countdownEndsAt = roomStatus.countdownEndsAt || null;
      updateLatestPlayers(roomStatus.players || []);
      syncCurrentPlayerPosition();
      updateRoomControls(roomStatus);
      syncScreenWithRoom(roomStatus);
      return roomStatus;
    }

    function updateRoomControls(roomStatus) {
      const roomExists = roomStatus.exists;
      createRoomButton.setAttribute("aria-disabled", String(roomExists));
      releaseRoomButton.classList.toggle("visible", roomExists);
      startGameButton.classList.toggle("visible", roomExists);
      adminPlayerCount.textContent = `参加人数: ${(roomStatus.players || []).length}人`;
    }

    function setMatchingMessage(message) {
      matchingStatus.textContent = message;
      matchingStatus.classList.add("visible");
    }

    function showWaitScreen() {
      canvas.style.display = "none";
      adminScreen.classList.remove("active");
      waitScreen.style.display = "block";
      resetMovementInput();
      gameJoined = false;
      adminMode = false;
      teacherMode = false;
      activeExplosionEffects.clear();
      previousItPlayerIds.clear();
    }

    async function showGameScreen() {
      if (adminMode) {
        setMatchingMessage("管理者はゲームに参加しません。参加する場合は待機画面に戻ってください。");
        return;
      }

      waitScreen.style.display = "none";
      adminScreen.classList.remove("active");
      canvas.style.display = "block";
      spawnPlayerAtRandomOpenPosition();
      previousTime = performance.now();
      await sendPlayerState("join");
      syncCurrentPlayerPosition();
      gameJoined = true;
    }

    function syncScreenWithRoom(roomStatus) {
      if (!roomStatus.exists && canvas.style.display === "block") {
        setMatchingMessage("部屋が切断されたため、待機画面に戻りました。");
        showWaitScreen();
        return;
      }

      if ((roomStatus.status === "playing" || roomStatus.status === "countdown") && waitScreen.style.display !== "none") {
        setMatchingMessage("ゲームは開始中です。参加する場合はマッチング開始を押してください。");
      }
    }

    window.setInterval(refreshRoomStatus, 2000);
    refreshRoomStatus();


    function getOrCreatePlayerId() {
      const storageKey = "tag-game-player-id";
      const savedPlayerId = window.localStorage.getItem(storageKey);
      if (savedPlayerId) return savedPlayerId;

      const newPlayerId = crypto.randomUUID();
      window.localStorage.setItem(storageKey, newPlayerId);
      return newPlayerId;
    }

    async function sendPlayerState(action = "updatePlayer") {
      if (playerSyncInFlight) return null;

      playerSyncInFlight = true;

      try {
        const roomStatus = await updateRoom("POST", {
          action,
          playerId,
          x: player.x,
          y: player.y,
          facing: player.idleFacing,
          running,
          worldWidth: world.width,
          worldHeight: world.height,
          role: teacherMode ? "demon" : "player",
        });
        updateLatestPlayers(roomStatus.players || []);
        return roomStatus;
      } finally {
        playerSyncInFlight = false;
      }
    }

    // ファイル名は手元の画像に合わせて変更してください
    const sprites = {
      idle: new Image(),
      run1: new Image(),
      run2: new Image(),
      enemyIdle: new Image(),
      enemyRun1: new Image(),
      enemyRun2: new Image(),
      ground: new Image(),
      house: new Image(),
      explosion1: new Image(),
      explosion2: new Image(),
      demonIdle: new Image(),
      demonRun1: new Image(),
      demonRun2: new Image(),
    };

    sprites.idle.src = "character/boy/standing_boy.png";
    sprites.run1.src = "character/boy/running_boy_1.png";
    sprites.run2.src = "character/boy/running_boy_2.png";
    sprites.enemyIdle.src = "character/boy/enemy_standingboy.png";
    sprites.enemyRun1.src = "character/boy/enemy_running_boy_2.png";
    sprites.enemyRun2.src = "character/boy/enemy_running_boy_1.png";
    sprites.ground.src = "Ground.png";
    sprites.house.src = "Obstacle/house.png";
    sprites.explosion1.src = "image/effect/explosion_1.png";
    sprites.explosion2.src = "image/effect/explosion_2.png";
    sprites.demonIdle.src = "character/demon/enemy_standing_demon.png";
    sprites.demonRun1.src = "character/demon/enemy_running_demon_1.png";
    sprites.demonRun2.src = "character/demon/enemy_running_demon_2.png";

    // ワールドの広さ。canvasより大きくして、カメラ追従を作る
    const world = {
      width: 5000,
      height: 3500,
    };

    const tileSize = 64;

    const obstacles = [
      {
        x: world.width / 2 + tileSize * 3,
        y: world.height / 2 - tileSize * 2,
        width: tileSize * 4,
        height: tileSize * 4,
        image: sprites.house,
      },
    ];

    const basePlayerSize = 48;
    const demonScale = Math.sqrt(3);
    const player = {
      x: world.width / 2,
      y: world.height / 2,
      width: basePlayerSize,
      height: basePlayerSize,
      speed: 280, // 1秒あたりの移動量
      facing: 1,  // 1: 右向き / -1: 左向き
      idleFacing: 1, // 最後に走った見た目の向き
    };

    const movementKeys = new Set([
      "arrowleft",
      "arrowright",
      "arrowup",
      "arrowdown",
      "a",
      "d",
      "w",
      "s",
    ]);
    const keys = {};
    const recentlyTaggedPlayers = new Map();
    const tagCooldownMs = 1000;

    function resetMovementInput() {
      for (const key of movementKeys) {
        keys[key] = false;
      }
    }

    function handleMovementKey(event, isPressed) {
      const key = event.key.toLowerCase();

      if (!movementKeys.has(key)) return;

      keys[key] = isPressed;
      event.preventDefault();
    }

    window.addEventListener("keydown", (event) => {
      handleMovementKey(event, true);
    });

    window.addEventListener("keyup", (event) => {
      handleMovementKey(event, false);
    });

    window.addEventListener("blur", resetMovementInput);
    window.addEventListener("pagehide", resetMovementInput);
    document.addEventListener("visibilitychange", () => {
      if (document.hidden) resetMovementInput();
    });

    let running = false;
    let animationTime = 0;
    let worldAnimationTime = 0;
    let previousTime = performance.now();

    function update(delta) {
      let dx = 0;
      let dy = 0;

      if (keys["arrowleft"] || keys["a"]) dx -= 1;
      if (keys["arrowright"] || keys["d"]) dx += 1;
      if (keys["arrowup"] || keys["w"]) dy -= 1;
      if (keys["arrowdown"] || keys["s"]) dy += 1;

      worldAnimationTime += delta;
      running = canMove() && (dx !== 0 || dy !== 0);

      // 斜め移動が速くなりすぎないよう調整
      if (running) {
        const length = Math.hypot(dx, dy);
        dx /= length;
        dy /= length;

        movePlayer(dx * getCurrentPlayerSpeed() * delta, dy * getCurrentPlayerSpeed() * delta);

        if (dx !== 0) {
          player.facing = dx > 0 ? 1 : -1;
        }

        // 実際に画面へ描く向きを保存して、停止時の待機向きに使う
        player.idleFacing = getRunningDrawFacing(getCurrentPlayerRole(), player.facing);

        animationTime += delta;
      } else {
        animationTime = 0;
      }

      // フィールド外に出ないようにする
      clampPlayerToWorld();
      updateTagCollisions();
    }

    function rectanglesOverlap(a, b) {
      return (
        a.x < b.x + b.width &&
        a.x + a.width > b.x &&
        a.y < b.y + b.height &&
        a.y + a.height > b.y
      );
    }

    function collidesWithObstacle(x, y) {
      return obstacles.some((obstacle) => rectanglesOverlap(getPlayerArea(x, y), obstacle));
    }

    function getPlayerDimensions(role = getCurrentPlayerRole()) {
      const scale = role === "demon" ? demonScale : 1;
      return {
        width: basePlayerSize * scale,
        height: basePlayerSize * scale,
      };
    }

    function getCurrentPlayerRole() {
      return getCurrentPlayerState()?.role || (teacherMode ? "demon" : "player");
    }

    function getCurrentPlayerSpeed() {
      return getCurrentPlayerRole() === "demon" ? player.speed * 1.35 : player.speed;
    }

    function getPlayerArea(x = player.x, y = player.y, role = getCurrentPlayerRole()) {
      const dimensions = getPlayerDimensions(role);
      return {
        x,
        y,
        width: dimensions.width,
        height: dimensions.height,
      };
    }

    function spawnPlayerAtRandomOpenPosition() {
      for (let attempt = 0; attempt < 200; attempt += 1) {
        const dimensions = getPlayerDimensions();
        const x = Math.random() * (world.width - dimensions.width);
        const y = Math.random() * (world.height - dimensions.height);

        if (!collidesWithObstacle(x, y)) {
          player.x = x;
          player.y = y;
          return;
        }
      }

      player.x = 0;
      player.y = 0;
    }

    function getCurrentPlayerState() {
      return latestPlayers.find((otherPlayer) => otherPlayer.id === playerId);
    }

    function isCurrentPlayerIt() {
      return Boolean(getCurrentPlayerState()?.isIt);
    }

    function canMove() {
      return latestRoomStatus === "playing";
    }

    function syncCurrentPlayerPosition() {
      const currentPlayer = getCurrentPlayerState();
      if (!currentPlayer || latestRoomStatus === "playing") return;

      player.x = currentPlayer.x;
      player.y = currentPlayer.y;
      player.idleFacing = currentPlayer.facing === -1 ? -1 : 1;
      running = false;
      resetMovementInput();
    }

    async function tagPlayer(targetId) {
      const now = performance.now();
      if (now - (recentlyTaggedPlayers.get(targetId) || 0) < tagCooldownMs) return;

      recentlyTaggedPlayers.set(targetId, now);
      const roomStatus = await updateRoom("POST", {
        action: "tag",
        playerId,
        targetId,
      });
      updateLatestPlayers(roomStatus.players || latestPlayers);
    }

    function updateTagCollisions() {
      if (!gameJoined || !canMove() || !isCurrentPlayerIt()) return;

      const currentPlayerArea = getPlayerArea();
      for (const otherPlayer of latestPlayers) {
        if (otherPlayer.id === playerId || otherPlayer.isIt) continue;

        const otherPlayerArea = {
          x: otherPlayer.x,
          y: otherPlayer.y,
          ...getPlayerDimensions(otherPlayer.role),
        };

        if (rectanglesOverlap(currentPlayerArea, otherPlayerArea)) {
          tagPlayer(otherPlayer.id);
        }
      }
    }


    function updateLatestPlayers(players) {
      const now = performance.now();
      const currentPlayerIds = new Set(players.map((otherPlayer) => otherPlayer.id));

      for (const otherPlayer of players) {
        if (otherPlayer.isIt && previousItPlayerIds.has(otherPlayer.id) === false) {
          const wasAlreadyKnown = latestPlayers.some((knownPlayer) => knownPlayer.id === otherPlayer.id);
          if (wasAlreadyKnown) {
            startExplosionEffect(otherPlayer.id, now);
          }
        }
      }

      previousItPlayerIds.clear();
      for (const otherPlayer of players) {
        if (otherPlayer.isIt) previousItPlayerIds.add(otherPlayer.id);
      }

      for (const playerIdWithEffect of activeExplosionEffects.keys()) {
        if (!currentPlayerIds.has(playerIdWithEffect)) {
          activeExplosionEffects.delete(playerIdWithEffect);
        }
      }

      latestPlayers = players;
      syncCurrentPlayerPosition();
    }

    function startExplosionEffect(effectPlayerId, now) {
      activeExplosionEffects.set(effectPlayerId, now);

      try {
        explosionSound.currentTime = 0.5;
        const playPromise = explosionSound.play();
        if (playPromise) playPromise.catch(() => {});
      } catch {
        // ブラウザの自動再生制限などで再生できない場合は、演出だけ続ける
      }
    }

    function getExplosionImage(effectStartTime, now) {
      const frame = Math.floor((now - effectStartTime) / explosionFrameDurationMs) % 2;
      return frame === 0 ? sprites.explosion1 : sprites.explosion2;
    }

    function drawExplosionEffect(effectStartTime, camera, x, y, role = "player") {
      const image = getExplosionImage(effectStartTime, performance.now());
      if (!image.complete || image.naturalWidth === 0) return;

      const dimensions = getPlayerDimensions(role);
      const explosionSize = dimensions.width * 2;
      ctx.drawImage(
        image,
        x - camera.x + dimensions.width / 2 - explosionSize / 2,
        y - camera.y + dimensions.height / 2 - explosionSize / 2,
        explosionSize,
        explosionSize,
      );
    }

    function getActiveExplosionStart(effectPlayerId, now = performance.now()) {
      const effectStartTime = activeExplosionEffects.get(effectPlayerId);
      if (effectStartTime === undefined) return null;

      if (now - effectStartTime >= explosionDurationMs) {
        activeExplosionEffects.delete(effectPlayerId);
        return null;
      }

      return effectStartTime;
    }

    function clampPlayerToWorld() {
      const dimensions = getPlayerDimensions();
      player.x = Math.max(0, Math.min(world.width - dimensions.width, player.x));
      player.y = Math.max(0, Math.min(world.height - dimensions.height, player.y));
    }

    function movePlayer(deltaX, deltaY) {
      const dimensions = getPlayerDimensions();
      const nextX = Math.max(0, Math.min(world.width - dimensions.width, player.x + deltaX));
      if (!collidesWithObstacle(nextX, player.y)) {
        player.x = nextX;
      }

      const nextY = Math.max(0, Math.min(world.height - dimensions.height, player.y + deltaY));
      if (!collidesWithObstacle(player.x, nextY)) {
        player.y = nextY;
      }
    }

    function getCamera() {
      const dimensions = getPlayerDimensions();
      let x = player.x + dimensions.width / 2 - canvas.width / 2;
      let y = player.y + dimensions.height / 2 - canvas.height / 2;

      x = Math.max(0, Math.min(world.width - canvas.width, x));
      y = Math.max(0, Math.min(world.height - canvas.height, y));

      return { x, y };
    }

    function drawWorld(camera) {
      drawGround(camera);
      drawObstacles(camera);

      // ワールド端を確認しやすい枠
      ctx.strokeStyle = "#355f28";
      ctx.lineWidth = 6;
      ctx.strokeRect(-camera.x, -camera.y, world.width, world.height);
    }

    function drawGround(camera) {
      if (!sprites.ground.complete || sprites.ground.naturalWidth === 0) {
        ctx.fillStyle = "#69b64a";
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        return;
      }

      const pattern = ctx.createPattern(sprites.ground, "repeat");

      ctx.save();
      ctx.translate(-(camera.x % sprites.ground.width), -(camera.y % sprites.ground.height));
      ctx.fillStyle = pattern;
      ctx.fillRect(
        0,
        0,
        canvas.width + sprites.ground.width,
        canvas.height + sprites.ground.height,
      );
      ctx.restore();
    }

    function drawObstacles(camera) {
      for (const obstacle of obstacles) {
        if (!obstacle.image.complete || obstacle.image.naturalWidth === 0) continue;

        ctx.drawImage(
          obstacle.image,
          obstacle.x - camera.x,
          obstacle.y - camera.y,
          obstacle.width,
          obstacle.height,
        );
      }
    }


    function drawOtherPlayers(camera) {
      for (const otherPlayer of latestPlayers) {
        if (otherPlayer.id === playerId) continue;

        const explosionStartTime = getActiveExplosionStart(otherPlayer.id);
        if (explosionStartTime !== null) {
          drawExplosionEffect(explosionStartTime, camera, otherPlayer.x, otherPlayer.y, otherPlayer.role);
          continue;
        }

        const image = getPlayerImage(otherPlayer.isIt, otherPlayer.running, otherPlayer.role);
        drawPlayerSprite(
          image,
          otherPlayer.x - camera.x,
          otherPlayer.y - camera.y,
          otherPlayer.facing === -1 ? -1 : 1,
          otherPlayer.role,
        );
      }
    }

    function getPlayerImage(isIt, isRunning, role = "player") {
      const frame = Math.floor(worldAnimationTime / 0.15) % 2;

      if (role === "demon") {
        if (!isRunning) return sprites.demonIdle;
        return frame === 0 ? sprites.demonRun1 : sprites.demonRun2;
      }

      if (!isRunning) return isIt ? sprites.enemyIdle : sprites.idle;
      if (!isIt) return frame === 0 ? sprites.run1 : sprites.run2;
      return frame === 0 ? sprites.enemyRun1 : sprites.enemyRun2;
    }

    function getRunningDrawFacing(role, movementFacing) {
      // boy の走り画像は待機画像と元の向きが逆だが、demon の走り画像は逆ではない
      return role === "demon" ? movementFacing : movementFacing * -1;
    }

    function drawPlayerSprite(image, screenX, screenY, drawFacing, role = getCurrentPlayerRole()) {
      ctx.save();

      const dimensions = getPlayerDimensions(role);

      if (drawFacing === -1) {
        ctx.translate(screenX + dimensions.width, screenY);
        ctx.scale(-1, 1);
        ctx.drawImage(image, 0, 0, dimensions.width, dimensions.height);
      } else {
        ctx.drawImage(image, screenX, screenY, dimensions.width, dimensions.height);
      }

      ctx.restore();
    }

    function drawPlayer(camera) {
      const explosionStartTime = getActiveExplosionStart(playerId);
      if (explosionStartTime !== null) {
        drawExplosionEffect(explosionStartTime, camera, player.x, player.y, getCurrentPlayerRole());
        return;
      }

      const image = getPlayerImage(isCurrentPlayerIt(), running, getCurrentPlayerRole());

      const screenX = player.x - camera.x;
      const screenY = player.y - camera.y;

      const role = getCurrentPlayerRole();
      const drawFacing = running ? getRunningDrawFacing(role, player.facing) : player.idleFacing;
      drawPlayerSprite(image, screenX, screenY, drawFacing, role);
    }

    function drawUI() {
      const role = getCurrentPlayerRole();
      const roleText = role === "demon" ? "demon" : (isCurrentPlayerIt() ? "鬼" : "逃亡者");
      ctx.save();
      ctx.font = "bold 52px sans-serif";
      ctx.textAlign = "center";
      ctx.lineWidth = 8;
      ctx.strokeStyle = "rgba(255, 255, 255, 0.9)";
      ctx.fillStyle = isCurrentPlayerIt() ? "#e60012" : "#33d7ff";
      ctx.strokeText(roleText, canvas.width / 2, 68);
      ctx.fillText(roleText, canvas.width / 2, 68);

      if (!canMove()) {
        const remainingSeconds = countdownEndsAt ? Math.max(0, Math.ceil((countdownEndsAt - Date.now()) / 1000)) : 5;
        ctx.font = "bold 42px sans-serif";
        ctx.fillStyle = "#ffffff";
        ctx.strokeStyle = "rgba(0, 0, 0, 0.8)";
        ctx.strokeText(`開始まで ${remainingSeconds}`, canvas.width / 2, 124);
        ctx.fillText(`開始まで ${remainingSeconds}`, canvas.width / 2, 124);
      }
      ctx.restore();
    }

    function loop(now) {
      const delta = Math.min((now - previousTime) / 1000, 0.05);
      previousTime = now;

      if (countdownEndsAt && latestRoomStatus === "countdown" && Date.now() >= countdownEndsAt) {
        latestRoomStatus = "playing";
        countdownEndsAt = null;
      }

      update(delta);

      if (gameJoined && canvas.style.display === "block" && now - lastPlayerSyncAt > 200) {
        lastPlayerSyncAt = now;
        sendPlayerState();
      }

      const camera = getCamera();
      drawWorld(camera);
      drawOtherPlayers(camera);
      drawPlayer(camera);
      drawUI();

      requestAnimationFrame(loop);
    }

    requestAnimationFrame(loop);
  </script>
</body>
</html>
